<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="考位满员后的三条备选路">
  <rect width="1100" height="640" rx="14" fill="#f5f7fb"/>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="30" font-weight="bold" fill="#22335c">满员之后：三条路，按顺序想</text>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
    <rect x="60" y="110" width="220" height="66" rx="10" fill="#e05252"/>
    <text x="170" y="152" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">报名页面：满员</text>
    <line x1="280" y1="143" x2="340" y2="143" stroke="#9aa9c7" stroke-width="3"/>
    <rect x="340" y="110" width="240" height="66" rx="10" fill="#fff" stroke="#c3cfe4"/>
    <text x="460" y="152" font-size="20" fill="#22335c" text-anchor="middle">先问自己两个问题</text>
    <text x="460" y="176" font-size="15" fill="#7385a8" text-anchor="middle">能去别的城市吗？急不急？</text>
    <line x1="460" y1="176" x2="460" y2="230" stroke="#9aa9c7" stroke-width="3"/>
    <rect x="60" y="235" width="310" height="150" rx="12" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
    <text x="90" y="275" font-size="21" font-weight="bold" fill="#1c4fae">路 ① 换城市考场</text>
    <text x="90" y="308" font-size="16" fill="#44557c">布里斯班 / 珀斯 / 阿德莱德</text>
    <text x="90" y="334" font-size="16" fill="#44557c">黄金海岸等（同日开考）</text>
    <text x="90" y="366" font-size="14" fill="#c0392b">⚠️ 先到 JF 官网确认余位</text>
    <rect x="400" y="235" width="310" height="150" rx="12" fill="#eafaf1" stroke="#1c8a5a" stroke-width="2"/>
    <text x="430" y="275" font-size="21" font-weight="bold" fill="#136b45">路 ② 瞄准 2027 年</text>
    <text x="430" y="308" font-size="16" fill="#44557c">7 月部分城市（往年堪培拉）</text>
    <text x="430" y="334" font-size="16" fill="#44557c">12 月是澳洲主力场</text>
    <text x="430" y="366" font-size="14" fill="#7385a8">报名约提前 3–4 个月</text>
    <rect x="740" y="235" width="300" height="150" rx="12" fill="#fff7e8" stroke="#d99a1b" stroke-width="2"/>
    <text x="770" y="275" font-size="21" font-weight="bold" fill="#a8770f">路 ③ 空档期不停学</text>
    <text x="770" y="308" font-size="16" fill="#44557c">官方样题自测、汉字量维持</text>
    <text x="770" y="334" font-size="16" fill="#44557c">下一轮直接报更高一级</text>
    <text x="770" y="366" font-size="14" fill="#7385a8">别让节奏断掉</text>
    <rect x="60" y="430" width="980" height="120" rx="12" fill="#fff" stroke="#c3cfe4"/>
    <text x="90" y="478" font-size="19" font-weight="bold" fill="#22335c">怎么选：</text>
    <text x="90" y="512" font-size="16" fill="#44557c">急用成绩、城市方便 → ①；不急、想报更高级别 → ②＋③组合；无论哪条，报名提醒现在就设好（下一轮 8 月下旬开抢）。</text>
  </g>
</svg>

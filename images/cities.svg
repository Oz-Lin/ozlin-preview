<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-label="澳洲 JLPT 考点城市速览">
  <rect width="1100" height="600" rx="14" fill="#f5f7fb"/>
  <text x="60" y="66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="30" font-weight="bold" fill="#22335c">澳洲考点城市速览（2026 年 12 月场）</text>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif">
    <g>
      <rect x="60" y="110" width="310" height="130" rx="12" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
      <text x="90" y="152" font-size="22" font-weight="bold" fill="#1c4fae">悉尼 Sydney</text>
      <text x="90" y="186" font-size="16" fill="#44557c">UNSW Kensington 校区</text>
      <text x="90" y="214" font-size="15" fill="#7385a8">N1–3 $105 / N4–5 $95（+手续费）</text>
    </g>
    <g>
      <rect x="395" y="110" width="310" height="130" rx="12" fill="#fff" stroke="#c3cfe4"/>
      <text x="425" y="152" font-size="22" font-weight="bold" fill="#22335c">布里斯班 Brisbane</text>
      <text x="425" y="186" font-size="16" fill="#44557c">St Lucia / South Bank</text>
      <text x="425" y="214" font-size="15" fill="#7385a8">具体教室看准考证</text>
    </g>
    <g>
      <rect x="730" y="110" width="310" height="130" rx="12" fill="#fff" stroke="#c3cfe4"/>
      <text x="760" y="152" font-size="22" font-weight="bold" fill="#22335c">珀斯 Perth</text>
      <text x="760" y="186" font-size="16" fill="#44557c">费用略低（N4–5 $85 起）</text>
      <text x="760" y="214" font-size="15" fill="#7385a8">适合西澳考生</text>
    </g>
    <g>
      <rect x="60" y="265" width="310" height="130" rx="12" fill="#fff" stroke="#c3cfe4"/>
      <text x="90" y="307" font-size="22" font-weight="bold" fill="#22335c">阿德莱德 Adelaide</text>
      <text x="90" y="341" font-size="16" fill="#44557c">12 月场开设城市</text>
      <text x="90" y="369" font-size="15" fill="#7385a8">余位以官网为准</text>
    </g>
    <g>
      <rect x="395" y="265" width="310" height="130" rx="12" fill="#fff" stroke="#c3cfe4"/>
      <text x="425" y="307" font-size="22" font-weight="bold" fill="#22335c">黄金海岸 Gold Coast</text>
      <text x="425" y="341" font-size="16" fill="#44557c">12 月场开设城市</text>
      <text x="425" y="369" font-size="15" fill="#7385a8">余位以官网为准</text>
    </g>
    <g>
      <rect x="730" y="265" width="310" height="130" rx="12" fill="#fff7e8" stroke="#d99a1b" stroke-width="2"/>
      <text x="760" y="307" font-size="22" font-weight="bold" fill="#a8770f">堪培拉 Canberra</text>
      <text x="760" y="341" font-size="16" fill="#44557c">往年 7 月场设考</text>
      <text x="760" y="369" font-size="15" fill="#7385a8">7 月场的备选方向</text>
    </g>
    <g>
      <rect x="60" y="420" width="980" height="110" rx="12" fill="#fdeeee" stroke="#e05252" stroke-width="2"/>
      <text x="90" y="462" font-size="20" font-weight="bold" fill="#c0392b">⚠️ 墨尔本 Melbourne</text>
      <text x="90" y="498" font-size="16" fill="#44557c">有消息称 2026 年 12 月场取消（往年设 Monash Clayton 考点）。报名前务必以 JF 官网当年公告为准，别按往年经验假设。</text>
    </g>
    <text x="60" y="568" font-size="15" fill="#8b99b8">来源：The Japan Foundation, Sydney 考点页及 UNSW 考点页 · 核对日期 2026-11-08 · 城市与费用逐年可能调整</text>
  </g>
</svg>
